name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-latest:
    name: Install latest (auto Rust)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup ardent
        id: ardent
        uses: ./

      - name: Verify ardent is available
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${{ steps.ardent.outputs.version }}" ]
          ardent --version | grep -q "${{ steps.ardent.outputs.version }}"

  test-version:
    name: Install specific version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup ardent
        uses: ./
        with:
          version: "0.3.1"

      - name: Verify correct version
        shell: bash
        run: ardent --version | grep -q "0.3.1"

  test-existing-rust:
    name: With pre-existing Rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1

      - name: Record Rust version
        id: rust
        shell: bash
        run: echo "version=$(rustc --version)" >> "$GITHUB_OUTPUT"

      - name: Setup ardent
        uses: ./

      - name: Verify Rust was not replaced
        shell: bash
        run: |
          [ "$(rustc --version)" = "${{ steps.rust.outputs.version }}" ]

      - name: Verify ardent is available
        shell: bash
        run: ardent --version
