name: "Setup Ardent"
description: "Install the ardent NSIS formatter CLI for use in GitHub Actions workflows"
author: "Jan T. Sott"

branding:
  icon: "download-cloud"
  color: "gray-dark"

inputs:
  version:
    description: "Version of ardent to install (leave empty for latest)"
    required: false
    default: ""

outputs:
  version:
    description: "Resolved ardent version"
    value: ${{ steps.vars.outputs.version }}

runs:
  using: "composite"
  steps:
    - name: Resolve version and paths
      id: vars
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        # The cache key needs a concrete version, so "latest" gets resolved here
        # rather than left to cargo. crates.io rejects requests without a User-Agent.
        if [ -z "$VERSION" ]; then
          VERSION=$(curl -fsSL -H "User-Agent: idleberg/setup-ardent" \
            "https://crates.io/api/v1/crates/ardent" \
            | grep -o '"max_stable_version":"[^"]*"' | head -1 | cut -d'"' -f4)
          [ -n "$VERSION" ] || { echo "could not resolve latest ardent version"; exit 1; }
          echo "resolved latest ardent version: $VERSION"
        fi

        # Forward slashes on Windows: usable from bash and from PATH alike
        prefix=$HOME/ardent
        [ "${{ runner.os }}" = Windows ] && prefix=$(cygpath -m "$HOME/ardent")

        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
        echo "key=ardent-${{ runner.os }}-$VERSION" >> "$GITHUB_OUTPUT"

    # Compiling the CLI is the expensive part, and its output depends on nothing
    # but the version, so one cache entry per OS and version is enough
    - name: Restore cached ardent build
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/ardent
        key: ${{ steps.vars.outputs.key }}

    - name: Setup Rust (if not already installed)
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        if ! command -v cargo &> /dev/null; then
          echo "::group::Installing Rust (minimal profile)"
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "::endgroup::"
        else
          echo "✓ Rust already available: $(cargo --version)"
        fi

    - name: Install ardent CLI
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        VERSION: ${{ steps.vars.outputs.version }}
        PREFIX: ${{ steps.vars.outputs.prefix }}
      run: |
        set -euo pipefail
        echo "::group::Installing ardent v$VERSION"
        export PATH="$HOME/.cargo/bin:$PATH"
        cargo install ardent --version "$VERSION" --root "$PREFIX"
        echo "::endgroup::"

    - name: Export PATH and verify
      shell: bash
      env:
        PREFIX: ${{ steps.vars.outputs.prefix }}
      run: |
        set -euo pipefail
        echo "$PREFIX/bin" >> "$GITHUB_PATH"
        "$PREFIX/bin/ardent" --version
        echo "✓ ardent successfully installed"
